spring:
  application:
    name: kidsvocab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/kidsvocab}
    username: ${DB_USER:kidsvocab}
    password: ${DB_PASSWORD:kidsvocab}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  training:
    show-correct-answer-seconds: 5
  scheduling:
    enabled: true
    # how often weeks are expired/activated and automatic drafts are prepared
    week-lifecycle-interval: PT15M
  ai:
    # none | gemini | openai-compatible (Groq, OpenRouter, Mistral, ...)
    provider: ${AI_PROVIDER:none}
    api-key: ${AI_API_KEY:}
    # empty = provider default (Gemini: gemini-flash-lite-latest; openai-compatible: Groq with openai/gpt-oss-120b)
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
    timeout: 20s
    # after an error or exhausted quota the provider is skipped for this long
    cooldown: 5m
  security:
    # At least 32 bytes. If empty, a random key is generated at startup (tokens do not survive a restart).
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # true behind HTTPS; false for plain-HTTP local development
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    pin-max-attempts: 5
    pin-lock-duration: 5m
